services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PGUSER:?}
      POSTGRES_PASSWORD: ${PGPASSWORD:?}
      POSTGRES_DB: ${PGDATABASE:?}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
